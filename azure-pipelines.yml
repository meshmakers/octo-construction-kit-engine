# Root-level CI pipeline using shared templates from octo-pipeline-templates.
#
# Phase 1 pilot 2 of the YAML migration (see octo-mesh-deployment's
# docs/pipeline-architecture-concept.md). The first pilot (DEH, PR #10/#11)
# proved out the L1 templates for a Lib without Docker; this one adds the
# consolidated build-and-push-docker template (tpl-v0.2.0) so the rest of the
# Lib + Adapter migrations don't have to invent it again.
#
# scripts/createDocumentation.ps1 was moved here from devops-build/ when the
# legacy folder was deleted in the cleanup PR.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by the release train on r-tag builds so the whole chain pins the
  # scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Default 'auto' = no override (version computed
  # normally); the train injects the real version on r-tag.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  # Chain link: exactly ONE upstream pipeline resource per repo. Pipeline
  # resource triggers do NOT batch, so a repo with two trigger parents is
  # started twice per main cascade. The chain is therefore a single-parent
  # tree; artificial ordering edges (marked below) resolve real DAG joins.
  # Full picture: octo-mesh-deployment/pipelines/orchestrator-ci.yml.
  # Ordering edge: CK-Engine does not consume DEH, but chaining it
  # behind DEH keeps octo-sdk (which needs BOTH) at one trigger parent.
  pipelines:
    - pipeline: octo-distributedEventHub
      source: octo-distributedEventHub-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.3.1

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  # Docs-only commits must not start CI (AB#5719). Excluded paths are
  # never consumed by the build; a root README.md change reaches the
  # packed NuGet readme with the next code commit.
  paths:
    exclude:
      - 'README.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - '.claude/'
      - 'docs/'
  tags:
    exclude:
      - '*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
  # CK publish routing (since tpl-v1.0.0): the shared catalogs are published ONLY by
  # validate-and-publish-ck-versions.yml (main -> private, r* tags -> private + public, after
  # build and tests; incident: Industry.Basic-2.1.1 pinned by Industry.Energy/Fluid/Maintenance/
  # Manufacturing without itself being published). update-build-number.yml no longer exports
  # OctoPublishCatalog / effectivePublishCatalog. The per-run local catalog root
  # (OctoLocalCatalogRootPath -> Agent.TempDirectory, AB#4167) is still exported by it, so the
  # local catalog this repo needs for its interdependent CK models is isolated per run instead
  # of shared via ~/.octo on the agent.
  #
  # Publish routing truth table for this repo's CK models (System, System.StreamData),
  # decided by validate-and-publish-ck-versions.yml (update-build-number's $(OctoPublishCkCatalogs)):
  #
  #   refs/heads/main          -> PrivateGitHubCatalog  (meshmakers/construction-kit-libraries-build)
  #   refs/tags/r<X.Y.Z>       -> private AND PublicGitHubCatalog (the public catalog)
  #   every other branch       -> validate only, nothing published (this repo does not set the
  #                               publishCkModelsToLaneCatalog opt-in)
  #
  # The test-only models Test / System.TestIdentity (tests/TestCkModel) are never published to a
  # GitHub catalog (OctoPublishCkModelToRemoteCatalog=false, AB#6114).
  #
  # Every dotnet step that can reach the CkCompile publish path passes
  # /p:OctoPublishCatalog=LocalFileSystemCatalog (AB#5413, kept as defence in depth): this repo
  # bootstraps its own Directory.Build.targets, which publishes with
  # `octo-ckc -c publish -c $(OctoPublishCatalog) -r` on every build of a CK-model project.
  #
  # Anti-regression note (2026-09-30): "System 2.3.0 is missing from
  # PrivateGitHubCatalog" was investigated and REFUTED. Builds 48269 and 48297 (both
  # main, both green) published System 2.3.0 and System.StreamData 1.11.0/1.12.0 into
  # construction-kit-libraries-build; the commits and ck-models/v2/s/System/2/catalog.json
  # (latestVersion 2.3.0, publishedAt 2026-09-30T05:10:17Z) prove it, and gh-pages
  # serves them. A model that is visible in EmbeddedResourceCatalog but not in
  # PrivateGitHubCatalog is a READ problem (gh-pages deploy serialization, AB#4872, or a
  # stale ~/.octo/ck-catalog/cache/private-github-catalog-cache*.json), not this pipeline.
  # Check the catalog repo's git log before touching anything here.

stages:
  - stage: Build
    jobs:
      - job: buildAndTest
        displayName: 'Build nuget and execute tests'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          - checkout: self
            clean: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          # This repo builds interdependent CK models in the same run (StreamData ->
          # System, Test/TestIdentity -> System). The glob compiles them alphabetically,
          # so a dependent (e.g. StreamData) compiles before its dependency (System) is
          # published, and resolves System back through the LocalFileSystemCatalog. That
          # catalog is disabled-for-read by default (Directory.Build.props, AB#2826), which
          # makes the compile throw "LocalFileSystemCatalog is not enabled for read
          # operations". Opt the local catalog back in for the steps that compile CK models
          # so dependency resolution succeeds (matches the MsBuild task default of true).
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build src'
            inputs:
              command: 'build'
              projects: |
                src/**/*.csproj
                !src/**/Generated*.csproj
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCatalog=LocalFileSystemCatalog /p:OctoLocalCatalogIsEnabled=true /p:OctoPrivateGitHubApiKey=$(GitHubPAT) /p:OctoPublicGitHubApiKey=$(GitHubPAT)'
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build samples'
            inputs:
              command: 'build'
              projects: 'samples/**/*.csproj'
              # Pinned for the same reason as the Test step below (AB#5413). No sample
              # owns a CK model today, so this changes nothing now — it keeps a future
              # one from reintroducing the leak silently.
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCatalog=LocalFileSystemCatalog'
          # Test projects are built ONCE here, so the Test step can run with
          # --no-build --no-restore (AB#6093). Before, `dotnet test` rebuilt every
          # test project together with its whole reference graph — including a
          # full re-run of CkCompile (which deliberately re-runs on every build, see
          # Directory.Build.targets) and a re-publish of System / System.StreamData
          # — which made up ~6 of the ~8.5 min Test step.
          # /p:BuildProjectReferences=false: every src project was already built in
          # Release by 'Build src' above into the same output folders, so only the
          # test-side projects themselves compile here. TestCkModel is not under
          # src/ and is not a *Tests project, so it gets its own step first (the
          # DotNetCoreCLI glob order is not guaranteed, and Runtime.Engine.Tests
          # needs TestCkModel.dll to exist when it resolves its references).
          # TestCkModel publishes the test-only Test and System.TestIdentity models
          # to the LocalFileSystemCatalog ONLY: its csproj sets
          # OctoPublishCkModelToRemoteCatalog=false (AB#6114), so they never reach
          # the shared GitHub catalogs (saved ~45-150 s per main run and kept the
          # catalogs free of test models). The /p:OctoPublishCatalog pin below stays
          # as defence in depth for the same reason as explained on the Test step
          # (AB#5413).
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build test CK model'
            inputs:
              command: 'build'
              projects: 'tests/TestCkModel/TestCkModel.csproj'
              arguments: '--configuration $(buildConfiguration) /p:BuildProjectReferences=false /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoLocalCatalogIsEnabled=true /p:OctoPublishCatalog=LocalFileSystemCatalog'
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build tests'
            inputs:
              command: 'build'
              projects: |
                tests/**/*Tests.csproj
                !tests/**/*SystemTests.csproj
              arguments: '--configuration $(buildConfiguration) /p:BuildProjectReferences=false /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoLocalCatalogIsEnabled=true /p:OctoPublishCatalog=LocalFileSystemCatalog'
          # 🔴 /p:OctoPublishCatalog=LocalFileSystemCatalog is NOT optional on any step that can
          # BUILD a CK-model project (AB#5413) — today that is 'Build test CK model' above;
          # the Test step itself no longer builds (--no-build since AB#6093) but keeps the pin
          # so that dropping --no-build can never reintroduce a leak. This repo cannot consume
          # its own MsBuildTasks package, so it bootstraps through its own Directory.Build.targets,
          # which publishes with `octo-ckc -c publish -c $(OctoPublishCatalog) -r` on every build
          # of a CK-model project — and the test projects reference those. Without a /p: switch,
          # MSBuild would pick OctoPublishCatalog up from the ENVIRONMENT. Since tpl-v1.0.0 the
          # shared catalogs are published only by validate-and-publish-ck-versions below (after the
          # tests); an unpinned step force published System, System.TestIdentity and Test into the
          # MAIN-lane catalog construction-kit-libraries-build before (0.2-dev lane, builds 48061
          # and 48096, 2026-09-29). Note this is specific to THIS repo's Exec-based publish. The
          # packaged targets used everywhere else do not re-enter the publish path in a test step.
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Test'
            inputs:
              command: 'test'
              # One `dotnet test` per project, sequentially (DotNetCoreCLI's default
              # for a multi-project glob) — keep it that way: parallel test runs risk
              # the Testcontainers memory budget of the DinD sidecar (14 Gi).
              arguments: '--configuration $(buildConfiguration) --no-build --no-restore /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoLocalCatalogIsEnabled=true /p:OctoPublishCatalog=LocalFileSystemCatalog'
              projects: |
                **/*Tests.csproj
                !**/*SystemTests.csproj
              testRunTitle: 'CI'
          # CK SemVer honesty gate AND publish (AB#4420, AB#5121, tpl-v1.0.0): after build and
          # tests this step validates the CK models against the last published version, compiles
          # them and, on main and r* tags, publishes them to the shared catalogs (never replacing a
          # published version). No build publishes to a shared catalog any more: every dotnet
          # step above pins /p:OctoPublishCatalog=LocalFileSystemCatalog (run-isolated through
          # OctoLocalCatalogRootPath), the exception the template documents for solutions whose
          # CK models depend on each other. Paths in dependency order (System before StreamData).
          # Note: this validates with the latest RELEASED octo-ckc from the feed — brand-new
          # schema features introduced in this repo may need a toolVersion pin until released.
          - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
            parameters:
              constructionKitPaths:
                - 'src/SystemCkModel/ConstructionKit'
                - 'src/StreamDataCkModel/ConstructionKit'
          # Multi-arch image (AB#4451): arm64 for Apple-Silicon kind clusters and
          # edge devices, amd64 for the managed clusters.
          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: meshmakers/octo-schema-provider
              dockerfile: src/ConstructionKit.SchemaProvider/Dockerfile
              platforms: 'linux/arm64,linux/amd64'
          - task: PowerShell@2
            displayName: 'Create api documentation'
            inputs:
              filePath: '$(System.DefaultWorkingDirectory)/scripts/createDocumentation.ps1'
              arguments: '-configuration $(buildConfiguration) -frameworkVersion $(artifactsFrameworkVersion)'
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
            parameters:
              constructionKitLibraryPaths:
                - 'src/SystemCkModel/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/SystemCkModel'
              apiDocumentationPaths:
                - '$(Build.SourcesDirectory)/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/documentation'
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
