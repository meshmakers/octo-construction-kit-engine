"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  # ---------- RollupArchive -----------------------------------------------------------------
  - id: RollupArchive.SourceArchiveRtId
    description: "Runtime id of the source Archive this rollup aggregates from. May reference another RollupArchive to form a chain (e.g. raw → 1 min → 1 h). Immutable after the rollup is activated. DEPRECATED since 1.8.0: declare sources via Sources; a set value is normalised into one unbounded source when Sources is empty; the platform never writes it."
    valueType: String
  - id: RollupArchive.Sources
    description: "Source archives this rollup aggregates from, each with an optional validity span (AB#5157). The default way to declare sources since 1.8.0 and the successor of the deprecated SourceArchiveRtId. A non-empty list wins over SourceArchiveRtId; spans must be pairwise disjoint (abutting spans are disjoint, intervals are half-open), at most one entry may have an open start and at most one an open end, and every boundary must lie on a bucket boundary of the rollup in its reference time zone. All sources must target the same CK type. Immutable after the rollup is activated."
    valueType: RecordArray
    valueCkRecordId: ${this}/CkRollupSourceReference
  - id: RollupArchive.BucketSizeMs
    description: "Width of the aggregation bucket in milliseconds. Each output row covers the half-open interval [bucketEnd - BucketSizeMs, bucketEnd). Must be positive and a multiple of the source rollup's bucket size when chaining. Immutable after activation. Int64 (AB#4281): calendar-month (2,419,200,000) and calendar-year (31,536,000,000) bucket widths exceed Int32.MaxValue (≈24.85 days), so the value type is 64-bit."
    valueType: Int64
  - id: RollupArchive.WatermarkLagMs
    description: "Lower bound on how far behind real-time the orchestrator stays before closing a bucket, in milliseconds. Absorbs late-arriving source inserts. Default 300000 (five minutes). Mutable. Int64 (AB#4281) for consistency with BucketSizeMs — a lag can legitimately be sized against a calendar bucket."
    valueType: Int64
    defaultValues:
      - 300000
  - id: RollupArchive.LastAggregatedBucketEnd
    description: "Exclusive end timestamp of the most recently committed bucket. Null before the first run. Maintained exclusively by the rollup orchestrator; manual edits go through the rewindRollupWatermark mutation."
    valueType: DateTime
  - id: RollupArchive.Aggregations
    description: "List of aggregation definitions. At least one entry is required at activation time. Immutable after activation; schema changes require creating a new rollup."
    valueType: RecordArray
    valueCkRecordId: ${this}/CkRollupAggregation
  - id: RollupArchive.FrozenUntil
    description: "When set, the rollup is read-only up to this timestamp: the orchestrator will not produce new buckets whose bucketEnd is ≤ FrozenUntil. Set automatically when the source archive is truncated for the covered range, so the already-aggregated history is preserved. Monotonic; can only move forward."
    valueType: DateTime
  - id: RollupArchive.BucketAlignment
    description: "Bucket-boundary alignment. FixedSize (default, key 0) preserves the legacy 'LastAggregatedBucketEnd + BucketSizeMs' arithmetic. Calendar/Iso8601 values align bucket boundaries to wall-clock UTC boundaries so monthly / weekly / yearly rollups become expressible without forcing BucketSizeMs into a single TimeSpan. Pre-1.4.0 entities resolve to FixedSize at read time. Immutable after activation."
    valueType: Enum
    valueCkEnumId: ${this}/BucketAlignment
    defaultValues:
      - 0
  - id: RollupArchive.ReferenceTimeZone
    description: "Optional IANA time-zone id (e.g. 'Europe/Vienna') used to align calendar bucket boundaries (day / week / month / year) to local wall-clock time so they are DST-correct across countries. Null (the default) keeps UTC calendar boundaries — the pre-1.6.4 behaviour. Only meaningful for calendar BucketAlignment variants; ignored for FixedSize. AB#4290 / decision O6."
    valueType: String
  - id: RollupArchive.CarryLookbackMs
    description: "How far before a bucket's start the TimeWeightedAvg carry-in scan (last observation carried forward) looks for the opening state, in milliseconds. Bounds the per-bucket source scan; a signal silent for longer than this loses its carry and the bucket becomes partially covered. Null (the default) uses the engine default of 35 days. Only consulted by TimeWeightedAvg aggregations; ignored otherwise. Mutable. AB#4336 / decision D1."
    valueType: Int64

  # ---------- CkRollupAggregation (record stays Ck-prefixed in Phase 2; renamed in Phase 2.5) -
  - id: CkRollupAggregation.SourcePath
    description: "Attribute path on the source archive (must exist in the source's Columns list at activation time). For chained rollups referencing a stored AVG, use the explicit _sum / _count column names."
    valueType: String
  - id: CkRollupAggregation.Function
    description: "Aggregation function applied to SourcePath within each bucket."
    valueType: Enum
    valueCkEnumId: ${this}/CkRollupFunction
  - id: CkRollupAggregation.TargetColumnName
    description: "Optional explicit storage column name. Default is '{sourcePath}_{function}' lower-cased; for AVG, two columns are created with suffixes _sum and _count derived from this base name."
    valueType: String
  - id: CkRollupAggregation.ComparisonValue
    description: "State literal a StateDuration aggregation matches the source column against — a number ('2', '100'), a boolean ('true'/'false'), or a string state name. Required when Function is StateDuration; ignored for every other function. AB#4336."
    valueType: String

  # ---------- CkRollupSourceReference (AB#5157) ---------------------------------------------
  - id: CkRollupSourceReference.SourceArchiveRtId
    description: "Runtime id of one source Archive this rollup aggregates from. May reference another RollupArchive to form a chain (e.g. raw → 1 min → 1 h). Each source archive may appear at most once in a rollup's Sources list. AB#5157."
    valueType: String
  - id: CkRollupSourceReference.ValidFrom
    description: "Inclusive start of the span in which this source is authoritative. Null means an open start — the source covers every bucket before its ValidTo. Must lie on a bucket boundary of the rollup in its reference time zone, and must be earlier than ValidTo when both are set. AB#5157."
    valueType: DateTime
  - id: CkRollupSourceReference.ValidTo
    description: "Exclusive end of the span in which this source is authoritative. Null means an open end — the source covers every bucket from its ValidFrom onwards. Must lie on a bucket boundary of the rollup in its reference time zone. A bucket no span covers stays empty and the watermark advances. AB#5157."
    valueType: DateTime
