$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
records:
  - recordId: CkArchiveConflictKey
    description: "One key of an archive's conflict precedence. The keys are compared in declaration order, lexicographically: the first key decides, and a later key only breaks a tie in every key before it. That ordering is what makes the outcome independent of the order writes arrive in — the surviving value is the maximum of a total order over the competing writes, which is the same whichever one is written first. Name a column of this archive; Order says which direction of it counts as better."
    attributes:
      - id: ${this}/CkArchiveConflictKey.Column
        name: Column
      - id: ${this}/CkArchiveConflictKey.Order
        name: Order
