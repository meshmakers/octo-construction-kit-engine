"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Archive
    derivable: Any
    description: "Abstract base for a CrateDB-backed time-series archive. Concrete subtypes: RawArchive (instant measurements with a single timestamp), RollupArchive (system-orchestrated bucket aggregations of another archive), TimeRangeArchive (externally aggregated values with [from, to) windows — added in a later concept). Shared attributes: TargetCkTypeId, Columns, Status, optional RawRetentionMs. Subtypes add their own time-axis semantics."
    derivedFromCkTypeId: ${System}/Entity
    isFinal: false
    isAbstract: true
    attributes:
      - id: ${this}/Archive.TargetCkTypeId
        name: TargetCkTypeId
      - id: ${this}/Archive.Columns
        name: Columns
      - id: ${this}/Archive.Status
        name: Status
      - id: ${this}/Archive.RawRetentionMs
        name: RawRetentionMs
        isOptional: true
      - id: ${this}/Archive.FirstActivatedAt
        name: FirstActivatedAt
        isOptional: true
      - id: ${this}/Archive.MaxRetroactiveReachMs
        name: MaxRetroactiveReachMs
        isOptional: true
      - id: ${this}/Archive.ConflictPrecedence
        name: ConflictPrecedence
        isOptional: true
      # ---------- Recompute dirty-tracking + observability (AB#4184) ----------
      - id: ${this}/Archive.DirtyWindows
        name: DirtyWindows
        isOptional: true
      - id: ${this}/Archive.PendingRecomputeRanges
        name: PendingRecomputeRanges
        isOptional: true
      - id: ${this}/Archive.RecomputeInProgress
        name: RecomputeInProgress
      - id: ${this}/Archive.LastRecomputeStartedAt
        name: LastRecomputeStartedAt
        isOptional: true
      - id: ${this}/Archive.LastRecomputeSuccessAt
        name: LastRecomputeSuccessAt
        isOptional: true
      - id: ${this}/Archive.LastRecomputeFailureAt
        name: LastRecomputeFailureAt
        isOptional: true
      - id: ${this}/Archive.LastRecomputeFailureReason
        name: LastRecomputeFailureReason
        isOptional: true
      # ---------- Status reason and Hidden columns (AB#6247, 1.27.0) ----------
      - id: ${this}/Archive.StatusReason
        name: StatusReason
        isOptional: true
      - id: ${this}/Archive.HiddenColumns
        name: HiddenColumns
        isOptional: true
    # AB#8598 (1.24.0, Feature AB#5697 F4.3): the archive lifecycle as CK methods, handled by the asset repository in-process
    # (execution.handler service; the asset repository owns stream data). They replace the streamData GraphQL mutations
    # activateArchive, disableArchive, enableArchive, retryArchiveActivation and deleteArchive, which stay and are deprecated.
    # Roles, input, result and error codes equal the mutations: role StreamDataAdmin, the same STREAMDATA_* codes. Declared on
    # the abstract base, so RawArchive, TimeRangeArchive and RollupArchive inherit them. Widening the roles later is a Minor,
    # narrowing them a Major.
    methods:
      - methodId: Activate-1
        description: "Provisions the CrateDB table and transitions the archive to Activated. Allowed from Created, Disabled and Failed; idempotent on Activated (mutation streamData.activateArchive)."
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "An archive the call needs does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning the CrateDB table failed; the archive is Failed and RetryActivation applies (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 120
          idempotent: true
      - methodId: Disable-1
        description: "Transitions the archive to Disabled. Allowed only from Activated; the CrateDB table and its data are kept (mutation streamData.disableArchive)."
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "An archive the call needs does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning the CrateDB table failed; the archive is Failed and RetryActivation applies (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
      - methodId: Enable-1
        description: "Transitions the archive from Disabled back to Activated and re-validates the column paths against the current CK model (mutation streamData.enableArchive)."
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "An archive the call needs does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning the CrateDB table failed; the archive is Failed and RetryActivation applies (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
      - methodId: RetryActivation-1
        description: "Retries the activation after a failed table provisioning. Allowed only from Failed (mutation streamData.retryArchiveActivation)."
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "An archive the call needs does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning the CrateDB table failed; the archive is Failed and RetryActivation applies (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 120
          idempotent: false
      - methodId: DeleteArchive-1
        description: "Drops the CrateDB table of the archive (idempotent) and deletes the archive entity. Destructive: the stored history is lost. Allowed from every status; the result is true (mutation streamData.deleteArchive). Named DeleteArchive because Delete is reserved for the generic delete."
        result:
          valueType: Boolean
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "An archive the call needs does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning the CrateDB table failed; the archive is Failed and RetryActivation applies (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 120
          idempotent: false
      # AB#6247 (1.27.0): the way out of a Hidden-column failure. Destructive and never run automatically: the caller must
      # confirm the data loss explicitly.
      - methodId: RedactHiddenColumns-1
        description: "Drops every ingested column of the archive that reaches a Hidden attribute under the current CK model: first the CrateDB columns, then the column definitions. DESTRUCTIVE: the values stored in these columns are lost and cannot be restored; every other column and row is kept. The redaction is recorded in the audit trail. An archive that the access re-validation set to Failed because of Hidden columns is activated again; any other archive keeps its status. Refused while a rollup archive aggregates one of the columns. Requires confirmDataLoss = true; without a Hidden column it changes nothing."
        parameters:
          - { name: confirmDataLoss, valueType: Boolean, description: "Must be true: confirms that the values stored in the dropped columns are lost." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveRedactionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist." }
          - { code: STREAMDATA_CONFIRMATION_REQUIRED, description: "confirmDataLoss was not true; nothing was dropped." }
          - { code: STREAMDATA_REDACTION_BLOCKED, description: "A rollup archive aggregates a column the call would drop; parameter rollupRtIds lists them. Nothing was dropped." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "The columns were dropped, but provisioning the CrateDB table on the resume failed; the archive is Failed and RetryActivation applies." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 300
          idempotent: true
      # AB#8600 (1.28.0, Feature AB#5697 F4.3): archive columns and computed columns as CK methods, mirroring the streamData
      # mutations addComputedColumn, addArchiveColumn, removeComputedColumn, updateComputedColumnFormula,
      # retryComputedColumnBackfill and repairComputedColumn, which stay and are deprecated. The backfills and repairs run as
      # background jobs (AB#8002) exactly as with the mutations; the methods answer once the job is queued. Rollups refuse
      # the column changes in the engine, as the mutations do.
      - methodId: AddComputedColumn-1
        description: "Adds a computed column to an Activated raw or time-range archive and queues its backfill as a background job: answers at once with the column in Backfilling; the job ends it Active (visible atomically) or Failed with the reason on the job. A Failed column is retried with RetryComputedColumnBackfill (mutation streamData.addComputedColumn)."
        parameters:
          - { name: name, valueType: String, description: "Output column name: the identifier formulas reference and the column appears under." }
          - { name: formula, valueType: String, description: "mXparser formula over other columns of the same row (e.g. activePower / apparentPower)." }
          - { name: resultType, valueType: Enum, valueCkEnumId: "${this}/CkComputedColumnResultType", description: "Declared type the formula result is cast back to." }
          - { name: indexed, valueType: Boolean, isOptional: true, description: "Whether the physical column is indexed. Default true." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state of the archive or the column; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type, or the archive is a rollup; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call (an invalid formula, an unknown computed column, a reference by another computed column, a column that reaches a Hidden attribute); parameter message carries the engine text (as the mutation; for an unknown computed column the mutation answers its generic error)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
      - methodId: AddColumn-1
        description: "Adds an ingested column for an existing attribute of the target CK type to an Activated raw or time-range archive without recreating it: the table gains a nullable column (existing rows read null), then the archive definition names it. Idempotent: a path the archive already captures changes nothing. Refused on a rollup, for a path that does not resolve and for a path that reaches a Hidden attribute (mutation streamData.addArchiveColumn)."
        parameters:
          - { name: path, valueType: String, description: "Attribute path on the target CK type of the archive (e.g. DischargingPower or Amount.Value)." }
          - { name: indexed, valueType: Boolean, isOptional: true, description: "Whether the physical column is indexed. Default false." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state of the archive or the column; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type, or the archive is a rollup; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call (an invalid formula, an unknown computed column, a reference by another computed column, a column that reaches a Hidden attribute); parameter message carries the engine text (as the mutation; for an unknown computed column the mutation answers its generic error)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: true
      - methodId: RemoveComputedColumn-1
        description: "Removes a computed column from the archive. Refused while another computed column references it. The physical CrateDB column stays as an orphan the read path no longer projects (mutation streamData.removeComputedColumn)."
        parameters:
          - { name: name, valueType: String, description: "Name of the computed column to remove." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state of the archive or the column; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type, or the archive is a rollup; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call (an invalid formula, an unknown computed column, a reference by another computed column, a column that reaches a Hidden attribute); parameter message carries the engine text (as the mutation; for an unknown computed column the mutation answers its generic error)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
      - methodId: UpdateComputedColumnFormula-1
        description: "Changes the formula of a computed column: readers keep the values of the previous formula while a background job backfills the new one, then switch atomically; a failed job reverts to the previous formula. Answers once the job is queued. Refused while another computed column references this one or while a backfill of the column is queued or running. The result type is unchanged (mutation streamData.updateComputedColumnFormula)."
        parameters:
          - { name: name, valueType: String, description: "Name of the computed column to re-formulate." }
          - { name: formula, valueType: String, description: "The new mXparser formula." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state of the archive or the column; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type, or the archive is a rollup; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call (an invalid formula, an unknown computed column, a reference by another computed column, a column that reaches a Hidden attribute); parameter message carries the engine text (as the mutation; for an unknown computed column the mutation answers its generic error)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
      - methodId: RetryComputedColumnBackfill-1
        description: "Queues the backfill of a computed column again - for a column that ended Failed, or that is stuck in Pending or Backfilling without a running job - and answers the queued job (ComputedColumnName set; an already queued job of the column is answered as is). No result (null) when the service has no recompute job store. Refused when the column is Active (mutation streamData.retryComputedColumnBackfill)."
        parameters:
          - { name: name, valueType: String, description: "Name of the computed column whose backfill is retried." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/RecomputeJobInfo
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state of the archive or the column; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type, or the archive is a rollup; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call (an invalid formula, an unknown computed column, a reference by another computed column, a column that reaches a Hidden attribute); parameter message carries the engine text (as the mutation; for an unknown computed column the mutation answers its generic error)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: true
      - methodId: RepairComputedColumn-1
        description: "Queues a repair of an Active computed column as a background job: re-evaluates the rows in [from, to) whose cell is null although an operand of the formula is not null and writes the results; the column stays Active. Answers the queued job (ComputedColumnName set; an already queued or running repair of the column is answered as is). No result (null) when the service has no recompute job store. Refused when the column does not exist or is not Active (mutation streamData.repairComputedColumn)."
        parameters:
          - { name: name, valueType: String, description: "Name of the computed column to repair." }
          - { name: from, valueType: DateTime, isOptional: true, description: "Inclusive start of the repaired range (UTC); default the first row of the archive." }
          - { name: to, valueType: DateTime, isOptional: true, description: "Exclusive end of the repaired range (UTC); default now." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/RecomputeJobInfo
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state of the archive or the column; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type, or the archive is a rollup; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call (an invalid formula, an unknown computed column, a reference by another computed column, a column that reaches a Hidden attribute); parameter message carries the engine text (as the mutation; for an unknown computed column the mutation answers its generic error)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: true
