"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: RollupArchive
    derivable: Any
    description: "Concrete Archive subtype for derived bucketed aggregations of another archive (raw or rollup-of-rollup). Columns are derived from Aggregations[], the inherited Columns attribute is populated automatically and an edit of it has no effect. Every rollup also carries the platform columns manual_count and last_manual_at, which are no part of the definition. Inserts happen exclusively through the system-internal rollup orchestrator. Aggregations, bucket size, alignment, time zone and sources are refused on an activated rollup (AB#7872): such a change needs a new rollup."
    derivedFromCkTypeId: ${this}/Archive
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/RollupArchive.SourceArchiveRtId
        name: SourceArchiveRtId
        isOptional: true
      - id: ${this}/RollupArchive.Sources
        name: Sources
        isOptional: true
      - id: ${this}/RollupArchive.BucketSizeMs
        name: BucketSizeMs
      - id: ${this}/RollupArchive.WatermarkLagMs
        name: WatermarkLagMs
      - id: ${this}/RollupArchive.LastAggregatedBucketEnd
        name: LastAggregatedBucketEnd
        isOptional: true
      - id: ${this}/RollupArchive.Aggregations
        name: Aggregations
      - id: ${this}/RollupArchive.FrozenUntil
        name: FrozenUntil
        isOptional: true
      - id: ${this}/RollupArchive.BucketAlignment
        name: BucketAlignment
        isOptional: true
      - id: ${this}/RollupArchive.ReferenceTimeZone
        name: ReferenceTimeZone
        isOptional: true
      - id: ${this}/RollupArchive.DayStartOffsetMs
        name: DayStartOffsetMs
        isOptional: true
      - id: ${this}/RollupArchive.CarryLookbackMs
        name: CarryLookbackMs
        isOptional: true
      - id: ${this}/RollupArchive.LastRunError
        name: LastRunError
        isOptional: true
      - id: ${this}/RollupArchive.LastRunErrorAt
        name: LastRunErrorAt
        isOptional: true
      - id: ${this}/RollupArchive.ConsecutiveRunFailures
        name: ConsecutiveRunFailures
        isOptional: true
    # AB#8598 (1.24.0, Feature AB#5697 F4.3): create as a static CK method, handled by the asset repository (replaces the
    # createRollupArchive mutation, which stays and is deprecated). Not replacesGenericCreate: blueprints seed rollups through
    # ImportRt (e.g. SmartMeterInsights.Base, EnergyCommunity.Base, voest-app), so the generic create stays.
    methods:
      - methodId: CreateArchive-1
        kind: Static
        description: "Creates a rollup archive in status Created; its target type and columns are derived from the source archive(s) and the aggregations. Returns the runtime id (mutation streamData.createRollupArchive)."
        parameters:
          - { name: archive, valueType: Record, valueCkRecordId: "${this}/RollupArchiveCreateInput", description: "The rollup to create: sources, bucket size, watermark lag, aggregations and the optional alignment settings (the input of createRollupArchive)." }
        result:
          valueType: String
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "A source archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the input; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
      # AB#8599 (1.25.0): rollup control and recomputation, mirroring the streamData mutations freezeRollupArchive,
      # unfreezeRollupArchive, rewindRollupWatermark, recomputeArchive and backfillRollupFromSource. Recompute and
      # BackfillFromSource stay synchronous (mode sync, answer the job as the mutations do); moving them to async methods is a
      # later decision after F3.6.
      - methodId: Freeze-1
        description: "Sets FrozenUntil on the rollup: the orchestrator stops producing buckets whose end falls in the frozen range. Monotonic - an earlier value than the current FrozenUntil is refused (use Unfreeze) (mutation streamData.freezeRollupArchive)."
        parameters:
          - { name: until, valueType: DateTime, description: "Inclusive upper bound of the frozen range (UTC)." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The rollup archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 30
          idempotent: true
      - methodId: Unfreeze-1
        description: "Clears FrozenUntil so the orchestrator produces the frozen buckets again; idempotent on an unfrozen rollup (mutation streamData.unfreezeRollupArchive)."
        parameters:
          - { name: acceptGaps, valueType: Boolean, isOptional: true, description: "Acknowledge that unfreezing over truncated source data produces gaps. Default false." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The rollup archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 30
          idempotent: true
      - methodId: RewindWatermark-1
        description: "Resets the aggregation watermark to an earlier bucket end (aligned down to the bucket grid) so the orchestrator re-aggregates the range, and clears recompute generations at and after it (mutation streamData.rewindRollupWatermark)."
        parameters:
          - { name: toBucketEnd, valueType: DateTime, description: "Target bucket end (exclusive, UTC); aligned down to the bucket boundary." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/ArchiveTransitionResult
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The rollup archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: true
      - methodId: Recompute-1
        description: "Recomputes the rollup over [from, to) into a staging generation and swaps the generation pointer atomically (AB#4184). Answers the recompute job; a refused precondition (archive missing or not activated) is a job in state Failed, as with the mutation (mutation streamData.recomputeArchive)."
        parameters:
          - { name: from, valueType: DateTime, description: "Inclusive range start (UTC), aligned down to the bucket grid." }
          - { name: to, valueType: DateTime, description: "Exclusive range end (UTC), aligned to the bucket grid." }
          - { name: rtIdScope, valueType: String, isOptional: true, description: "Optional runtime id of a single entity (metering point, stream) the recompute is restricted to." }
        result:
          valueType: Record
          valueCkRecordId: ${this}/RecomputeJobInfo
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The rollup archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 300
          idempotent: false
      - methodId: BackfillFromSource-1
        description: "Queues a durable background backfill of the rollup over the entire history of its source archive and answers the Pending job at once; the recompute runs later on the background orchestrator. No result (null) when the source archive holds no data (mutation streamData.backfillRollupFromSource)."
        result:
          valueType: Record
          valueCkRecordId: ${this}/RecomputeJobInfo
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "The rollup archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The change is not allowed in the current state; parameters fromStatus and attemptedTransition (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the call; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
