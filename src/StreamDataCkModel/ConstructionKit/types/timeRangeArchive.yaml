"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: TimeRangeArchive
    derivable: Any
    description: "Concrete Archive subtype for externally pre-aggregated time-range data. Each row carries an explicit [from, to) window (a System/TimeRange record on the time axis at the storage layer) instead of a single timestamp. External systems (EDA reports, smart meters, weather APIs) push data directly via SaveTimeRangeStreamDataInArchive@1 / IStreamDataRepository.InsertTimeRangeAsync — there is no source archive and no system orchestrator on this path. Concept doc: docs/concept-time-range-archives.md."
    derivedFromCkTypeId: ${this}/Archive
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/TimeRangeArchive.Period
        name: Period
        isOptional: true
    # AB#8598 (1.24.0, Feature AB#5697 F4.3): create as a static CK method, handled by the asset repository (replaces the
    # createTimeRangeArchive mutation, which stays and is deprecated). Not replacesGenericCreate: blueprints seed time-range
    # archives through ImportRt (e.g. SmartMeterInsights.Base, EnergyCommunity.Base), so the generic create stays.
    methods:
      - methodId: CreateArchive-1
        kind: Static
        description: "Creates a time-range archive in status Created from the target CK type, the attribute-path columns and an optional advisory period, and returns its runtime id (mutation streamData.createTimeRangeArchive)."
        parameters:
          - { name: archive, valueType: Record, valueCkRecordId: "${this}/TimeRangeArchiveCreateInput", description: "The archive to create: target CK type, columns, optional well-known name and period (the input of createTimeRangeArchive)." }
        result:
          valueType: String
        errors:
          - { code: STREAMDATA_ARCHIVE_NOT_FOUND, description: "A source archive does not exist (as the mutation)." }
          - { code: STREAMDATA_ARCHIVE_NOT_ACTIVATED, description: "An archive the call needs is not activated (as the mutation)." }
          - { code: STREAMDATA_INVALID_TRANSITION, description: "The transition is not allowed from the current status (as the mutation)." }
          - { code: STREAMDATA_SCHEMA_IMMUTABLE, description: "The archive schema cannot change in its current state (as the mutation)." }
          - { code: STREAMDATA_PATH_INVALID, description: "A column path does not resolve on the target CK type; parameter path (as the mutation)." }
          - { code: STREAMDATA_ACTIVATION_FAILED, description: "Provisioning a CrateDB table failed (as the mutation)." }
          - { code: STREAMDATA_ERROR, description: "Any other stream-data rule refused the input; parameter message carries the engine text (as the mutation)." }
          - { code: STREAMDATA_NOT_ENABLED, description: "Stream data is not enabled for the tenant (the mutation answers this as a generic error)." }
        authorization:
          roles: [ StreamDataAdmin ]
        execution:
          timeoutSeconds: 60
          idempotent: false
