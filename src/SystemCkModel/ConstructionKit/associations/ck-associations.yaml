"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
associationRoles:
  - id: ParentChild
    description: "Hierarchical parent-child relationship for building tree structures."
    inboundName: Children
    inboundMultiplicity: N
    outboundName: Parent
    outboundMultiplicity: One
  - id: Related
    description: "Generic many-to-many relationship for linking related entities."
    inboundName: RelatesFrom
    inboundMultiplicity: N
    outboundName: RelatesTo
    outboundMultiplicity: N
  # System 2.9.0 (AB#9752): a storno document cancels exactly one released original. The document
  # model declares it on its storno type (e.g. Basic/Document); System declares only the role.
  - id: Cancels
    description: "A storno (cancellation) document references the released document it cancels; the original stays unchanged."
    inboundName: CancelledBy
    inboundMultiplicity: N
    outboundName: Cancels
    outboundMultiplicity: One
