"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  - id: ConfigurationValue
    description: "Stores configuration data such as schema version or identity information."
    valueType: String
  - id: EnvironmentMode
    description: "Defines the operational mode of the tenant (Development, Testing, Staging, Production)."
    valueType: Enum
    valueCkEnumId: ${this}/EnvironmentModes
    defaultValues:
      - 0
  - id: MaintenanceLevel
    description: "Defines the maintenance state of the tenant (Off, UserApps, FullSystem)."
    valueType: Enum
    valueCkEnumId: ${this}/MaintenanceLevels
    defaultValues:
      - 0
  # Per-tenant observability opt-in. Two separate switches rather than one, because the
  # two areas are produced by different services from different data and a tenant can
  # reasonably want one without the other. Deliberately NOT a flags enum: the CK model
  # has no flags support anywhere - none in any model, none in the engine - so a
  # combinable enum would have had to be invented first.
  #
  # Both default to false. A test tenant nobody cares about therefore costs nothing,
  # which is the point: observability data is not free, and the decision belongs per
  # tenant.
  - id: PublishCkModelObservability
    description: "If true, the platform publishes CK model health for this tenant (library resolve failures, catalog inconsistencies). Defaults to false."
    valueType: Boolean
    defaultValues:
      - false
  # Requires the communication controller to be enabled for the tenant. If it is not,
  # the emitting job skips the tenant SILENTLY - the setting states the intent, the job
  # decides what is possible. Validating it in the UI would force the configuration page
  # to know about communication state, which it has no business knowing.
  - id: PublishWorkloadObservability
    description: "If true, the platform publishes workload state for this tenant - deployment state, online/offline and configuration errors of adapters, pools and applications. Requires communication to be enabled; without it the tenant is skipped silently. Defaults to false."
    valueType: Boolean
    defaultValues:
      - false
