"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Device
    derivedFromCkTypeId: ${System}/Entity
    displayNameRule: "${Name} (${Serial})"
    attributes:
      - id: ${System}/Name
        name: Name
      - id: ${this}/Serial
        name: Serial
      - id: ${this}/Window
        name: Window
        isOptional: true
      - id: ${this}/Mode
        name: Mode
    associations:
      - id: ${System}/ParentChild
        targetCkTypeId: ${System}/Entity
  - typeId: DeviceSettings
    derivedFromCkTypeId: ${System}/Configuration
