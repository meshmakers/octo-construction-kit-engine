  - id: System-2.5.0/SortOrder-1
    name: SortOrder
- recordId: TextSearchFilter
  description: Defines a full-text search filter that searches across all searchable fields.
  attributes:
  - id: System-2.5.0/ComparisonValue-1
    name: SearchValue
- recordId: TimeRange
  description: A time range with an inclusive start and exclusive end date (UTC). System-scope mirror of Basic/TimeRange so System.*-level CKs can reference it without depending on the Basic CK; see concept-time-range-archives.md.
  attributes:
  - id: System-2.5.0/From-1
    name: From
  - id: System-2.5.0/To-1
    name: To
enums:
- enumId: AggregationTypes
  values:
  - key: 0
    name: Count
    description: Counts the number of items
  - key: 1
    name: Minimum
    description: Finds the minimum value
  - key: 2
    name: Maximum
    description: Finds the maximum value
  - key: 3
    name: Average
    description: Calculates the average value
  - key: 4
    name: Sum
    description: Calculates the sum of values
  - key: 5
    name: TimeWeightedAverage
    description: Time-weighted average with last-observation-carried-forward interval weighting, for event-based archives. Yields the duty cycle on 0/100 or boolean-like signals. Resolvable against rollup archives that materialise a TimeWeightedAvg aggregation. AB#4336.
  - key: 6
    name: StateDuration
    description: Absolute time (milliseconds) an event-based signal held the column's ComparisonValue within the query window, with last-observation-carried-forward semantics. Requires AggregationQueryColumn.ComparisonValue. Supported over raw event archives and rollup archives that materialise a StateDuration aggregation. AB#4336/AB#4341.
  description: This enum defines the different aggregation types available for queries.
- enumId: EnvironmentModes
  values:
  - key: 0
    name: Development
    description: The tenant is in development mode, used for development and testing
  - key: 1
    name: Testing
    description: The tenant is in testing mode, used for quality assurance
  - key: 2
    name: Staging
    description: The tenant is in staging mode, used for pre-production testing
  - key: 3
    name: Production
    description: The tenant is in production mode, used for live operations
  description: This enum defines the different modes a tenant can operate in.
- enumId: FieldFilterOperator
  values:
  - key: 0
    name: Equals
    description: Compares the specified field to the specified value.
  - key: 1
    name: NotEquals
    description: Compares the specified field to the specified value and returns true if the values are not equal.
  - key: 2
    name: LessThan
    description: Compares the specified field to the specified value and returns true if the field value is less than the specified value.
  - key: 3
    name: LessEqualThan
    description: Compares the specified field to the specified value and returns true if the field value is less than or equal to the specified value.
  - key: 4
    name: GreaterThan
    description: Compares the specified field to the specified value and returns true if the field value is greater than the specified value.
  - key: 5
    name: GreaterEqualThan
    description: Compares the specified field to the specified value and returns true if the field value is greater than or equal to the specified value.
  - key: 6
    name: In
    description: Compares a field to be equal any value in the specified array.
  - key: 7
    name: NotIn
    description: Compares a field to be not equal any value in the specified array.
  - key: 8
    name: Like
    description: Compares a field to the specified value using a pattern matching comparison. Use * as a wildcard character.
  - key: 9
    name: MatchRegEx
    description: Matches a field containing a value that matches the specified regular expression.
  - key: 10
    name: AnyEq
    description: Compares an array field with at least one element that matches the specified value.
  - key: 11
    name: AnyLike
    description: Compares an array field with at least one element that matches the specified value using a pattern matching comparison. Use * as a wildcard character.
  - key: 12
    name: Match
    description: Matches an array field with at least one element that matches all the specified query criteria.
  description: The operator to use for filtering fields.
- enumId: MaintenanceLevels
  values:
  - key: 0
    name: Off
    description: The maintenance mode is off, the tenant is fully operational
  - key: 1
    name: UserApps
    description: The user apps are in maintenance mode, the tenant is operational but user apps are not available
  - key: 2
    name: FullSystem
    description: The full system is in maintenance mode, the tenant is not operational
  description: This enum defines the maintenance level of a tenant.
- enumId: NavigationFilterModes
  values:
  - key: 0
    name: Filter
    description: Entities without matching associations are filtered out (pre-pagination).
  - key: 1
    name: Include
    description: Entities without matching associations are kept with null values (post-pagination).
  description: Controls how navigation properties affect the result set.
- enumId: QueryTypes
  values:
  - key: 0
    name: Flat
    description: A flat query
  - key: 1
    name: Tree
    description: A tree query that returns results from a tree
  description: The type of query
- enumId: SortOrders
  values:
  - key: 0
    name: Default
    description: Default sorting based on data source type
  - key: 1
    name: Ascending
    description: Ascending order
  - key: 2
    name: Descending
    description: Descending order
  description: The sort order of a field.
modelId: System-2.5.0
description: Core system model library providing foundational types for entity management, multi-tenant configuration, auto-increment sequences, a comprehensive query system with support for filtering/sorting/aggregations/text-search, the System/TimeRange record used by stream-data archives, and per-tenant blueprint registry types (Installation/History/Backup) that track which blueprints have been applied.
