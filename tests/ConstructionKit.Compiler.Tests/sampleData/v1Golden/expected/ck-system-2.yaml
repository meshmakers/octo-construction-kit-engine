  description: Array of attribute paths to project from the archive table.
- id: StreamDataQuery.From
  valueType: DateTime
  description: Start of the time window for the stream data query. Can be overridden at execution time.
- id: StreamDataQuery.Limit
  valueType: Int
  description: Maximum number of rows to return.
- id: StreamDataQuery.RtIds
  valueType: StringArray
  description: Optional list of runtime entity IDs to scope the stream data query.
- id: StreamDataQuery.To
  valueType: DateTime
  description: End of the time window for the stream data query. Can be overridden at execution time.
- id: TenantId
  valueType: String
  description: Unique identifier for the tenant in the multi-tenant system.
- id: TimeRange
  valueType: Record
  valueCkRecordId: System-2.5.0/TimeRange-1
  description: A time range with an inclusive start and exclusive end date (UTC).
- id: To
  valueType: DateTime
  description: Exclusive end of a TimeRange (UTC).
records:
- recordId: AggregationQueryColumn
