    name: ComparisonValue
    isOptional: true
- recordId: AttributeSearchFilter
  description: Defines a search filter that searches only within specified attributes.
  attributes:
  - id: System-2.5.0/AttributePaths-1
    name: AttributePaths
  - id: System-2.5.0/ComparisonValue-1
    name: SearchValue
- recordId: FieldFilter
  description: Defines a filter condition for a specific attribute with an operator and comparison value.
  attributes:
  - id: System-2.5.0/AttributePath-1
    name: AttributePath
  - id: System-2.5.0/FieldFilter.Operator-1
    name: Operator
  - id: System-2.5.0/ComparisonValue-1
    name: ComparisonValue
